# macOS, Linux, Android and iOS builds of Aether. Windows is built locally by scripts/release.mjs.
# Run by scripts/release-unix.mjs (or by hand from the Actions tab); it uploads the signed
# installers and updater bundles as workflow artifacts, which that script then publishes to
# both GitHub releases and merges into latest.json so these builds update themselves too.
name: Desktop builds (macOS, Linux, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: false
        default: main
      platforms:
        description: all, desktop, android or ios
        required: false
        default: all

jobs:
  build:
    if: inputs.platforms == 'all' || inputs.platforms == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-15-intel
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - name: linux
            runner: ubuntu-22.04
            target: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.name }}" = "macos" ]; then
            B=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$B"/dmg/*.dmg out/
            cp "$B"/macos/*.app.tar.gz out/
            cp "$B"/macos/*.app.tar.gz.sig out/
          else
            B=src-tauri/target/release/bundle
            cp "$B"/appimage/*.AppImage out/
            cp "$B"/appimage/*.AppImage.sig out/
            cp "$B"/deb/*.deb out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  android:
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship the Android SDK and NDK; just point at them.
      - name: Android SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: npm ci

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          # App icon: the generated project starts with Tauri's default icon; replace it with ours.
          npx tauri icon public/icon.svg
          # Voice and video calls need the microphone and camera; notifications need permission too.
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"

      - name: Build
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > ks.jks
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$KS_PW" --key-pass "pass:$KS_PW" --ks-key-alias aether --out out/aether-android.apk aligned.apk
          "$BT/apksigner" verify out/aether-android.apk
          rm -f ks.jks
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: aether-android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # iPhone / iPad: an unsigned .ipa for sideloading (SideStore, AltStore, Sideloadly sign it with
  # the person's own Apple ID). Apple's paid developer account isn't needed.
  ios:
    if: inputs.platforms == 'all' || inputs.platforms == 'ios'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: npm ci

      - name: Generate the Xcode project
        run: |
          npx tauri ios init --ci
          npx tauri icon public/icon.svg
          P=src-tauri/gen/apple/aetherchat_iOS/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Aether uses the microphone for voice calls.'" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Aether uses the camera for video calls.'" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Aether lets you send photos from your library.'" "$P" || true

      - name: Build (unsigned)
        run: |
          npm run build
          # Build the Rust side ourselves and put it where the Xcode project links it from, then turn
          # off the Xcode step that expects "tauri ios build" to be running (it would also try to sign).
          (cd src-tauri && cargo build --release --lib --target aarch64-apple-ios)
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libaetherchat_lib.a src-tauri/gen/apple/Externals/arm64/release/libapp.a
          perl -pi -e 's/shellScript = ".*xcode-script.*";/shellScript = "true";/' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          grep -c 'shellScript = "true"' src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          cd src-tauri/gen/apple
          SCHEME=$(xcodebuild -list -json | python3 -c "import json,sys; print([s for s in json.load(sys.stdin)['project']['schemes'] if s.endswith('_iOS')][0])")
          xcodebuild -scheme "$SCHEME" -configuration release -sdk iphoneos -destination 'generic/platform=iOS'             -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          APP=$(find src-tauri/gen/apple/build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          echo "Built $APP"
          mkdir -p out Payload
          cp -R "$APP" Payload/
          zip -qry out/aether-ios.ipa Payload
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: aether-ios
          path: out/*
          if-no-files-found: error
          retention-days: 14
