<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080f" />
    <meta name="description" content="Aether: chat, voice and video with your friends and communities." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" keeps the app below the status bar: no iOS 26 glass blur over the top bar. -->
    <!-- iOS 26 blurs the top of Home Screen apps unless the status bar is "default" (an opaque bar in theme-color). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Aether</title>

  </body>
</html>
