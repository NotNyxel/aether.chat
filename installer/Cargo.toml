[package]
name = "aetherchat-setup"
version = "1.7.4"
description = "aether.chat Setup: one-click installer"
edition = "2021"
publish = false

[[bin]]
name = "aetherchat-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
