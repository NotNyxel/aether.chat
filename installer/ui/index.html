<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>aether.chat Setup</title>
    <style>
      :root {
        --a: #7c5cff;
        --b: #00d4ff;
        --ok: #3ddc97;
        --muted: #9a98b6;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        color: #eeedf7;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        cursor: default;
        background: #08080f;
      }
      body {
        display: grid;
        grid-template-rows: 34px 1fr auto;
      }
      .sky {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(70% 90% at 0% 0%, rgba(124, 92, 255, 0.3), transparent 60%),
          radial-gradient(60% 80% at 100% 100%, rgba(0, 212, 255, 0.18), transparent 60%);
        pointer-events: none;
      }
      .sky::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 12% 40%, #fff7, transparent),
          radial-gradient(1px 1px at 64% 18%, #fff5, transparent),
          radial-gradient(1.5px 1.5px at 82% 62%, #b9a8ff88, transparent),
          radial-gradient(1px 1px at 34% 82%, #9feaff66, transparent);
        background-size: 220px 160px;
        animation: twinkle 5s ease-in-out infinite alternate;
      }
      @keyframes twinkle {
        to {
          opacity: 0.35;
        }
      }
      header {
        position: relative;
        display: flex;
        align-items: center;
        padding-left: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      header .grow {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
      }
      header button {
        width: 44px;
        height: 34px;
        border: 0;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      header button:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      header button.x:hover {
        background: #e5484d;
      }
      header button:disabled {
        opacity: 0.3;
        pointer-events: none;
      }
      main {
        position: relative;
        display: grid;
        grid-template-columns: 150px 1fr;
        align-items: center;
        padding: 0 30px 0 22px;
      }
      .orbit {
        position: relative;
        width: 124px;
        height: 124px;
        display: grid;
        place-items: center;
      }
      .orbit img {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 8px 24px rgba(124, 92, 255, 0.55));
        transition: transform 400ms cubic-bezier(0.2, 0.9, 0.3, 1.3);
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.07);
      }
      .ring.t {
        inset: 12px -10px;
        transform: rotate(28deg);
      }
      .sat {
        position: absolute;
        inset: 0;
        animation: spin 2.4s linear infinite;
      }
      .t .sat {
        animation-duration: 3.8s;
        animation-direction: reverse;
      }
      .sat::after {
        content: '';
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--b);
        box-shadow: 0 0 12px var(--b);
      }
      .t .sat::after {
        width: 6px;
        height: 6px;
        background: var(--a);
        box-shadow: 0 0 12px var(--a);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .done .sat {
        animation-duration: 0.9s;
      }
      .done .orbit img {
        transform: scale(1.08);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 21px;
        font-weight: 700;
      }
      h1 span {
        background: linear-gradient(90deg, var(--a), var(--b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        min-height: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .track {
        margin-top: 16px;
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--a), var(--b));
        transition: width 260ms ease;
        position: relative;
        overflow: hidden;
      }
      #fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        animation: sheen 1.4s ease-in-out infinite;
      }
      @keyframes sheen {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }
      .done #fill {
        background: linear-gradient(90deg, var(--ok), var(--b));
      }
      .steps {
        display: flex;
        gap: 14px;
        margin-top: 12px;
        font-size: 11.5px;
        color: #5f5d78;
      }
      .steps li {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 200ms ease;
      }
      .steps li::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        transition: background 200ms ease;
      }
      .steps li.on {
        color: #d8d6ee;
      }
      .steps li.on::before {
        background: var(--b);
        box-shadow: 0 0 8px var(--b);
      }
      .steps li.ok {
        color: var(--ok);
      }
      .steps ul {
        margin: 0;
        padding: 0;
        display: contents;
      }
      footer {
        position: relative;
        padding: 0 22px 14px;
        font-size: 11.5px;
        color: #6d6b88;
        min-height: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #tip {
        flex: 1;
        transition: opacity 300ms ease;
      }
      .btn {
        display: none;
        padding: 7px 16px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(90deg, var(--a), var(--b));
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.08);
      }
      .err #status {
        color: #ff8a8f;
      }
      .err .btn {
        display: inline-block;
      }
      .err #fill {
        background: #e5484d;
      }
      .err #fill::after,
      .done #fill::after {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .sat,
        #fill::after,
        .sky::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <header>
      <div class="grow" data-tauri-drag-region>aether.chat Setup</div>
      <button id="min" type="button" aria-label="Minimise">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2" /></svg>
      </button>
      <button id="close" class="x" type="button" aria-label="Close" disabled>
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1 1 9" stroke="currentColor" stroke-width="1.2" /></svg>
      </button>
    </header>
    <main data-tauri-drag-region>
      <div class="orbit">
        <div class="ring"><div class="sat"></div></div>
        <div class="ring t"><div class="sat"></div></div>
        <img src="icon.svg" alt="" draggable="false" />
      </div>
      <div>
        <h1>Installing <span>aether</span>.chat</h1>
        <div id="status">Getting things ready…</div>
        <div class="track"><div id="fill"></div></div>
        <div class="steps">
          <ul>
            <li id="s1" class="on">Unpack</li>
            <li id="s2">Install</li>
            <li id="s3">Launch</li>
          </ul>
        </div>
      </div>
    </main>
    <footer>
      <span id="tip"></span>
      <button id="cancel" class="btn ghost" type="button">Close</button>
      <button id="retry" class="btn" type="button">Try again</button>
    </footer>
    <script src="setup.js"></script>
  </body>
</html>
