<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>aether.chat</title>
    <style>
      :root {
        --a: #7c5cff;
        --b: #00d4ff;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #08080f;
        color: #ecebf5;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(120% 70% at 50% 0%, rgba(124, 92, 255, 0.28), transparent 60%),
          radial-gradient(90% 60% at 50% 110%, rgba(0, 212, 255, 0.16), transparent 60%),
          #08080f;
      }
      /* Faint star dust drifting upward */
      .dust {
        position: fixed;
        inset: -50% 0 0;
        background-image:
          radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
          radial-gradient(1px 1px at 70% 80%, #fff6, transparent),
          radial-gradient(1.5px 1.5px at 40% 60%, #b9a8ff88, transparent),
          radial-gradient(1px 1px at 85% 20%, #fff5, transparent),
          radial-gradient(1px 1px at 10% 90%, #9feaff77, transparent);
        background-size: 180px 180px;
        animation: drift 22s linear infinite;
        opacity: 0.6;
        pointer-events: none;
      }
      @keyframes drift {
        to {
          transform: translateY(180px);
        }
      }
      .drag {
        position: fixed;
        inset: 0;
      }
      .orbit {
        position: relative;
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 8px 26px rgba(124, 92, 255, 0.55));
        animation: breathe 2.8s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 10px 34px rgba(0, 212, 255, 0.55));
        }
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.07);
      }
      .ring.tilt {
        inset: 10px -14px;
        transform: rotate(-24deg);
      }
      .sat {
        position: absolute;
        inset: 0;
        animation: spin 2.6s linear infinite;
      }
      .tilt .sat {
        animation-duration: 4.2s;
        animation-direction: reverse;
      }
      .sat::after {
        content: '';
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--b);
        box-shadow: 0 0 12px var(--b);
      }
      .tilt .sat::after {
        background: var(--a);
        box-shadow: 0 0 12px var(--a);
        width: 6px;
        height: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 22px 0 4px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      h1 span {
        background: linear-gradient(90deg, var(--a), var(--b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #status {
        height: 18px;
        font-size: 12.5px;
        color: #a19fbd;
        transition: opacity 160ms ease;
      }
      .bar {
        width: 168px;
        height: 4px;
        margin-top: 14px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .bar.on {
        opacity: 1;
      }
      #fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--a), var(--b));
        transition: width 200ms ease;
      }
      .bar.busy #fill {
        width: 40%;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      #version {
        position: fixed;
        bottom: 12px;
        font-size: 11px;
        color: #5f5d78;
      }
      #skip {
        display: none;
        margin-top: 12px;
        padding: 6px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--a), var(--b));
        cursor: pointer;
        position: relative;
      }
      @media (prefers-reduced-motion: reduce) {
        .sat,
        .logo,
        .dust {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="dust"></div>
    <div class="drag" data-tauri-drag-region></div>
    <div class="orbit">
      <div class="ring"><div class="sat"></div></div>
      <div class="ring tilt"><div class="sat"></div></div>
      <img class="logo" src="/icon.svg" alt="" draggable="false" />
    </div>
    <h1><span>aether</span>.chat</h1>
    <div id="status">Starting…</div>
    <div class="bar busy" id="bar"><div id="fill"></div></div>
    <button id="skip" type="button">Continue anyway</button>
    <div id="version"></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
