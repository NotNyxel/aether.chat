[package]
name = "aetherchat"
version = "1.7.0"
description = "AetherChat: lightweight P2P chat, voice and screen share"
edition = "2021"

[lib]
name = "aetherchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

# Desktop only (Windows, macOS, Linux); the Android app is the web app in a native shell.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Now-playing detection (Spotify) through Windows' media session API.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections"] }
# Native screen/window capture (Windows Graphics Capture), frame scaling and JPEG for the in-app
# share picker; WASAPI process loopback for "share audio" (excluding aether.chat's own sound).
windows-capture = "2.0.1"
fast_image_resize = "6.1.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
wasapi = "0.27.0"
